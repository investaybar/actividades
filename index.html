let filters = {free:'all',age:'all',country:'all',week:'all',source:'all'};

function setFilter(el,key){
  document.querySelectorAll('[data-filter="'+key+'"]').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  filters[key]=el.dataset.val;
  render();
}

function match(a){
  if(filters.free==='true'&&!a.free) return false;
  if(filters.age!=='all'){
    const mn=parseInt(filters.age),mx=mn+2;
    if(a.age_max!==null&&a.age_max<mn) return false;
    if(a.age_min!==null&&a.age_min>mx) return false;
  }
  if(filters.country!=='all'&&a.country!==filters.country&&a.country!=='FR/CH') return false;
  if(filters.week!=='all'&&a.week!==filters.week) return false;
  if(filters.source!=='all'&&a.source!==filters.source) return false;
  return true;
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function ctag(c){
  if(c==='FR') return '<span class="tag tag-fr">🇫🇷</span>';
  if(c==='CH') return '<span class="tag tag-ch">🇨🇭</span>';
  return '<span class="tag tag-fr">🇫🇷</span><span class="tag tag-ch">🇨🇭</span>';
}

function ageStr(a){
  if(a.age_min!==null&&a.age_max!==null) return a.age_min+'–'+a.age_max+' años';
  if(a.age_min!==null) return '+'+a.age_min+' años';
  if(a.age_max!==null) return 'hasta '+a.age_max+' años';
  return '';
}

function tableRow(a){
  const t=a.url?'<a class="act-link" href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.title)+'</a>':'<span class="no-link">'+esc(a.title)+'</span>';
  const ft=a.free?' <span class="tag tag-free">Gratis</span>':'';
  return '<tr><td>'+t+ft+'</td><td>'+ctag(a.country)+'</td><td class="muted">'+esc(a.commune)+'</td><td class="muted">'+ageStr(a)+'</td><td class="muted">'+esc(a.source)+'</td></tr>';
}

function mobCard(a){
  const cls=a.url?'mob-title':'mob-title no-link';
  const t=a.url?'<a class="'+cls+'" href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.title)+'</a>':'<div class="'+cls+'">'+esc(a.title)+'</div>';
  const ft=a.free?'<span class="tag tag-free">Gratis</span>':'';
  const ag=ageStr(a)?'<span>'+ageStr(a)+'</span>':'';
  return '<div class="mob-card">'+t+'<div class="mob-meta">'+ctag(a.country)+'<span>'+esc(a.commune)+'</span>'+ag+ft+'<span>'+esc(a.source)+'</span></div></div>';
}

function weekOrder(w){if(w==='Esta semana')return 0;if(w==='Próxima semana')return 1;const m=w.match(/\+(\d+)/);return m?parseInt(m[1]):99;}

function buildBlock(items){
  const byDay={};
  for(const a of items){const k=a.date+'|'+a.day;if(!byDay[k])byDay[k]=[];byDay[k].push(a);}
  const keys=Object.keys(byDay).sort((x,y)=>x.split('|')[0].localeCompare(y.split('|')[0]));
  let tr='',mc='';
  for(const k of keys){
    const day=k.split('|')[1];
    tr+='<tr class="day-sep"><td colspan="5">'+esc(day)+'</td></tr>';
    mc+='<div class="day-mob">'+esc(day)+'</div>';
    for(const a of byDay[k]){tr+=tableRow(a);mc+=mobCard(a);}
  }
  return {tr,mc};
}

function render(){
  const visible=DATA.filter(match);
  document.getElementById('counter').textContent=visible.length;

  const byWeek={};
  for(const a of visible){if(!byWeek[a.week])byWeek[a.week]=[];byWeek[a.week].push(a);}
  const wks=Object.keys(byWeek).sort((a,b)=>weekOrder(a)-weekOrder(b));

  let html='';
  for(const w of wks){
    const {tr,mc}=buildBlock(byWeek[w]);
    html+='<div class="week-block"><div class="week-label">'+esc(w)+'</div>'
      +'<table class="act-table"><thead><tr>'
      +'<th style="width:42%">Actividad</th><th style="width:8%">País</th>'
      +'<th style="width:16%">Ciudad</th><th style="width:11%">Edades</th>'
      +'<th style="width:13%">Fuente</th></tr></thead><tbody>'+tr+'</tbody></table>'
      +'<div class="mob-list">'+mc+'</div></div>';
  }
  if(!html) html='<div class="empty">No hay actividades para los filtros seleccionados.</div>';
  document.getElementById('main-list').innerHTML=html;

  const rw=document.getElementById('rec-wrap');
  if(RECURRING.length>0){
    rw.style.display='';
    const {tr,mc}=buildBlock(RECURRING);
    document.getElementById('rec-table').innerHTML=tr;
    document.getElementById('rec-mob').innerHTML=mc;
  } else { rw.style.display='none'; }
}

render();
</script>
