let filters = { free: 'all', age: 'all', country: 'all', week: 'all', source: 'all' };

function toggleFree(el) {
  document.querySelectorAll('.pill.free-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  filters.free = el.dataset.val;
  render();
}
function setAge(el) {
  document.querySelectorAll('[data-filter="age"]').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  filters.age = el.dataset.val;
  render();
}
function setCountry(el) {
  document.querySelectorAll('[data-filter="country"]').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  filters.country = el.dataset.val;
  render();
}
function setWeek(el) {
  document.querySelectorAll('[data-filter="week"]').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  filters.week = el.dataset.val;
  render();
}
function setSource(el) {
  document.querySelectorAll('[data-filter="source"]').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  filters.source = el.dataset.val;
  render();
}

function matchActivity(a) {
  if (filters.free === 'true' && !a.free) return false;
  if (filters.age !== 'all') {
    const minAge = parseInt(filters.age);
    const maxAge = minAge + 2;
    if (a.age_max !== null && a.age_max < minAge) return false;
    if (a.age_min !== null && a.age_min > maxAge) return false;
  }
  if (filters.country !== 'all') {
    if (a.country !== filters.country && a.country !== 'FR/CH') return false;
  }
  if (filters.week !== 'all' && a.week !== filters.week) return false;
  if (filters.source !== 'all' && a.source !== filters.source) return false;
  return true;
}

function cardHTML(a) {
  const title = a.url
    ? `<a href="${a.url}" target="_blank" rel="noopener">${esc(a.title)}</a>`
    : `<span class="no-link">${esc(a.title)}</span>`;
  const tags = [];
  if (a.free) tags.push('<span class="tag tag-free">Gratis</span>');
  if (a.country === 'FR') tags.push('<span class="tag tag-fr">🇫🇷</span>');
  else if (a.country === 'CH') tags.push('<span class="tag tag-ch">🇨🇭</span>');
  else if (a.country === 'FR/CH') tags.push('<span class="tag tag-fr">🇫🇷</span><span class="tag tag-ch">🇨🇭</span>');
  if (a.commune) tags.push(`<span class="tag tag-loc">📍 ${esc(a.commune)}</span>`);
  if (a.time) tags.push(`<span class="tag tag-time">🕐 ${esc(a.time)}</span>`);
  if (a.age_min !== null || a.age_max !== null) {
    const ageStr = a.age_min !== null && a.age_max !== null
      ? `${a.age_min}–${a.age_max} años`
      : a.age_min !== null ? `desde ${a.age_min} años` : `hasta ${a.age_max} años`;
    tags.push(`<span class="tag tag-age">${ageStr}</span>`);
  }
  tags.push(`<span class="tag tag-source">${esc(a.source)}</span>`);
  return `<div class="card"><div>${title}</div><div class="meta">${tags.join('')}</div></div>`;
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const visible = DATA.filter(matchActivity);
  document.getElementById('counter').textContent = visible.length;

  // Group by week → day
  const byWeek = {};
  for (const a of visible) {
    if (!byWeek[a.week]) byWeek[a.week] = {};
    if (!byWeek[a.week][a.day]) byWeek[a.week][a.day] = [];
    byWeek[a.week][a.day].push(a);
  }

  // Week order
  const weekOrder = w => {
    if (w === 'Esta semana') return 0;
    if (w === 'Próxima semana') return 1;
    const m = w.match(/\+(\d+)/);
    return m ? parseInt(m[1]) : 99;
  };

  let html = '';
  const weeks = Object.keys(byWeek).sort((a,b) => weekOrder(a) - weekOrder(b));
  for (const week of weeks) {
    html += `<div class="week-section"><div class="week-title">${esc(week)}</div>`;
    const days = Object.keys(byWeek[week]);
    for (const day of days) {
      html += `<div class="day-group"><div class="day-label">${esc(day)}</div><div class="cards">`;
      for (const a of byWeek[week][day]) html += cardHTML(a);
      html += '</div></div>';
    }
    html += '</div>';
  }
  if (!html) html = '<div class="empty">No hay actividades para los filtros seleccionados.</div>';
  document.getElementById('main-list').innerHTML = html;

  // Recurring
  const recEl = document.getElementById('recurring-section');
  const recList = document.getElementById('recurring-list');
  if (RECURRING.length > 0) {
    recEl.style.display = '';
    recList.innerHTML = RECURRING.map(cardHTML).join('');
  } else {
    recEl.style.display = 'none';
  }
}

render();
</script>
